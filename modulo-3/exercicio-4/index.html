<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f4f4; padding: 2rem; max-width: 600px; margin: 0 auto; }
    h1 { color: #1a1a2e; margin-bottom: 1.5rem; font-size: 1.8rem; }
    form { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
    input[type="text"] { flex: 1; padding: 0.7rem 1rem; border: 1px solid #ddd; border-radius: 0.5rem; font-size: 0.95rem; }
    button { padding: 0.7rem 1.2rem; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: transform 0.2s; }
    #btn-adicionar { background: #1a1a2e; color: #e2b96f; }
    #busca { width: 100%; padding: 0.7rem 1rem; border: 1px solid #ddd; border-radius: 0.5rem; font-size: 0.9rem; margin-bottom: 1.2rem; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
    li { background: #fff; border: 1px solid #e0e0e0; border-radius: 0.5rem; padding: 0.8rem 1rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background 0.2s; }
    li.concluida { text-decoration: line-through; color: #aaa; background: #f0f0f0; }
    li span { flex: 1; }
    li .btn-remover { background: #c0392b; color: #fff; padding: 0.3rem 0.7rem; border-radius: 0.4rem; font-size: 0.8rem; border: none; cursor: pointer; }
    button:hover { transform: translateY(-1px); }
  </style>
</head>
<body>

  <h1>Lista de Tarefas</h1>

  <form id="form-tarefa">
    <input type="text" id="input-tarefa" placeholder="Nova tarefa..." required>
    <button type="submit" id="btn-adicionar">Adicionar</button>
  </form>

  <input type="text" id="busca" placeholder="Buscar tarefas...">

  <ul id="lista-tarefas"></ul>

  <script src="tarefas.js"></script>
</body>
</html>
