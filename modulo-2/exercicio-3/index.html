<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Matrícula — FATEC</title>
</head>
<body>

  <header>
    <h1>FATEC Itapetininga</h1>
    <h2>Formulário de Matrícula</h2>
  </header>

  <main>
    <form action="#" method="post">

      <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" minlength="5" required placeholder="Digite seu nome completo">

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required placeholder="seuemail@email.com">

        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" name="nascimento">

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00">

        <label for="foto">Foto</label>
        <input type="file" id="foto" name="foto" accept="image/*">

        <label for="cor">Cor favorita</label>
        <input type="color" id="cor" name="cor" value="#1a73e8">
      </fieldset>

      <fieldset>
        <legend>Dados Acadêmicos</legend>

        <label for="curso">Curso</label>
        <select id="curso" name="curso">
          <option value="">Selecione um curso</option>
          <option value="dsm">Desenvolvimento de Software Multiplataforma</option>
          <option value="ads">Análise e Desenvolvimento de Sistemas</option>
          <option value="bd">Banco de Dados</option>
        </select>

        <fieldset>
          <legend>Período</legend>
          <label>
            <input type="radio" name="periodo" value="manha"> Manhã
          </label>
          <label>
            <input type="radio" name="periodo" value="noite"> Noite
          </label>
        </fieldset>

        <label>
          <input type="checkbox" name="programou" value="sim">
          Já programou antes?
        </label>
      </fieldset>

      <fieldset>
        <legend>Observações</legend>
        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes" rows="5" placeholder="Escreva suas observações aqui..."></textarea>
      </fieldset>

      <button type="submit">Enviar Matrícula</button>
    </form>
  </main>

  <footer>
    <p>FATEC 2026</p>
  </footer>

</body>
</html>
